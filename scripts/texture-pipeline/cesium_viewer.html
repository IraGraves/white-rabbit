<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cesium 3D Tiles Viewer</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 10px 15px;
            border-radius: 5px;
            font-family: sans-serif;
            font-size: 14px;
            z-index: 1000;
        }
        #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(200,50,50,0.9);
            color: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 16px;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div id="info">Loading tileset...</div>
    <div id="error"></div>
    
    <script>
        (async () => {
            const params = new URLSearchParams(window.location.search);
            const tilesetUrl = params.get('url') || './tiles_out/tileset.json';
            
            const infoDiv = document.getElementById('info');
            const errorDiv = document.getElementById('error');
            
            infoDiv.textContent = `Loading: ${tilesetUrl}`;
            
            try {
                // Define Moon Ellipsoid (Radius in meters)
                const moonEllipsoid = new Cesium.Ellipsoid(1737400.0, 1737400.0, 1737400.0);

                // Create viewer with Moon globe
                const viewer = new Cesium.Viewer("cesiumContainer", {
                    globe: new Cesium.Globe(moonEllipsoid),
                    mapProjection: new Cesium.GeographicProjection(moonEllipsoid),
                    skyBox: false,
                    skyAtmosphere: false,
                    baseLayerPicker: false,
                    geocoder: false,
                    homeButton: false,
                    sceneModePicker: false,
                    navigationHelpButton: false,
                    animation: false,
                    timeline: false,
                    fullscreenButton: true,
                    vrButton: false,
                    scene3DOnly: true,
                    imageryProvider: false, // No default Earth imagery
                    selectionIndicator: false,
                    infoBox: false
                });
                
                // Configure globe appearance
                viewer.scene.globe.baseColor = Cesium.Color.BLACK;
                
                // Set dark background
                viewer.scene.backgroundColor = Cesium.Color.BLACK;
                
                // Load and add tileset
                const tileset = await Cesium.Cesium3DTileset.fromUrl(tilesetUrl);
                viewer.scene.primitives.add(tileset);
                
                // Zoom to tileset
                await viewer.zoomTo(tileset);
                
                infoDiv.textContent = `Tileset loaded: ${tilesetUrl}`;
                
                // Listen for tile load progress
                tileset.tileLoad.addEventListener(() => {
                    infoDiv.textContent = `Tiles: ${tileset.statistics.numberOfTilesStyled} styled, ${tileset.statistics.numberOfTilesTotal} total`;
                });
                
            } catch (e) {
                console.error('Failed to load tileset:', e);
                errorDiv.textContent = `Failed to load tileset: ${e.message}`;
                errorDiv.style.display = 'block';
                infoDiv.textContent = 'Error loading tileset';
            }
        })();
    </script>
</body>
</html>
